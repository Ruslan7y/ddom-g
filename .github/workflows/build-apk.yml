name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install
        run: npm ci

      - name: Rule engine tests
        run: npm test

      - name: Sync web → Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Domino101-RealTable-0.1.${BUILD_NUMBER}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Domino101-APK-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${BUILD_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --title "Domino 101: Real Table — 0.1.${BUILD_NUMBER}" \
            --notes "Otomatik derleme. APK dosyasını indirip telefonuna kur (Bilinmeyen kaynaklara izin ver). Commit: ${GITHUB_SHA::7}" \
            --latest
